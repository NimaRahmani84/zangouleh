<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zangouleh | Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
#reset-box{max-width:460px;margin:5rem auto;padding:0 1rem}
#reset-loading{text-align:center;padding:4rem 2rem}
.spin{display:inline-block;width:40px;height:40px;border:3px solid rgba(130,35,49,0.2);border-top-color:var(--burgundy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-error{background:#fff0f0;border:1px solid #f5c6cb;color:#721c24;padding:.7rem 1rem;border-radius:4px;font-size:.82rem;margin-bottom:1rem;display:none}
</style>
</head>
<body>
<nav id="mainNav">
  <a href="index.html" class="nav-logo">Zangouleh<span>Music School · آموزشگاه موسیقی</span></a>
</nav>

<main>
  <div id="reset-loading" class="page-content"><div class="spin"></div></div>

  <div id="reset-box" style="display:none" class="page-content">
    <h2 style="font-family:var(--font-display);font-size:1.8rem;color:var(--burgundy);font-style:italic;text-align:center;margin-bottom:.3rem">Set New Password</h2>
    <p style="text-align:center;font-size:.82rem;color:var(--ink-soft);margin-bottom:2rem">Choose a new password for your account.</p>
    <div class="login-error" id="reset-error"></div>
    <form onsubmit="handleReset(event)">
      <div class="form-group"><label class="form-label">New Password</label><input type="password" id="reset-password" class="form-input" placeholder="At least 6 characters" minlength="6" required></div>
      <div class="form-group"><label class="form-label">Confirm Password</label><input type="password" id="reset-password2" class="form-input" required></div>
      <button type="submit" class="btn-primary" style="width:100%;margin-top:.5rem" id="reset-btn">Update Password</button>
    </form>
  </div>

  <div id="reset-invalid" style="display:none" class="page-content">
    <p style="text-align:center;color:var(--ink-soft)">This reset link is invalid or has expired.</p>
    <p style="text-align:center"><a href="portal.html" style="color:var(--burgundy)">Back to Portal</a></p>
  </div>

  <div id="reset-done" style="display:none" class="page-content">
    <p style="text-align:center;color:var(--burgundy);font-weight:600">✓ Password updated successfully!</p>
    <p style="text-align:center"><a href="portal.html" style="color:var(--burgundy)">Go to Sign In</a></p>
  </div>
</main>

<script>
let recoverySession = null;

sb.auth.onAuthStateChange((event, session) => {
  document.getElementById('reset-loading').style.display = 'none';
  if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) {
    recoverySession = session;
    document.getElementById('reset-box').style.display = 'block';
  }
});

setTimeout(() => {
  if (!recoverySession) {
    document.getElementById('reset-loading').style.display = 'none';
    if (document.getElementById('reset-box').style.display === 'none') {
      document.getElementById('reset-invalid').style.display = 'block';
    }
  }
}, 3000);

async function handleReset(e) {
  e.preventDefault();
  const btn = document.getElementById('reset-btn');
  const err = document.getElementById('reset-error');
  err.style.display = 'none';
  const p1 = document.getElementById('reset-password').value;
  const p2 = document.getElementById('reset-password2').value;
  if (p1 !== p2) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }
  btn.textContent = 'Updating…'; btn.disabled = true;
  const { error } = await sb.auth.updateUser({ password: p1 });
  btn.textContent = 'Update Password'; btn.disabled = false;
  if (error) { err.textContent = error.message; err.style.display = 'block'; return; }
  document.getElementById('reset-box').style.display = 'none';
  document.getElementById('reset-done').style.display = 'block';
}
</script>
</body>
</html>
